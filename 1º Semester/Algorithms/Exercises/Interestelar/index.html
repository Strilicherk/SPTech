<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>
<body style="display: flex; flex-direction: column; gap: 10px;">
    <label for="nome_astronauta">Nome do Astronauta: </label>
    <input type="text" id="nome_astronauta" /> <br />
    <label for="nome_planeta">Nome do Planeta: </label>
    <input type="text" id="nome_planeta" /> <br />
    <label for="tempo_relativo">Tempo Relativo no Planeta: </label>
    <input type="number" id="tempo_relativo" /> <br />
    <label for="dias_viagem">Duração da Viagem (Dias): </label>
    <input type="number" id="dias_viagem" /> <br />
    <label for="horas_viagem">Duração da Viagem (Horas): </label>
    <input type="number" id="horas_viagem" /> <br />
    <label for="minutos_viagem">Duração da Viagem (Minutos): </label>
    <input type="number" id="minutos_viagem" /> <br />
    <div style="width: 50%;">
        <button onclick="RegistrarViagem()">Registrar Viagem</button>
        <button onclick="RelatorioViagens()">Relatório de Viagens</button>
    </div>
    <div id="relatorio_viagens" style="display: flex; flex-direction: column; gap: 30px;">
        
    </div>
    
    <script>
        var viagemValida;
        var viagens = [];
        
        
        var nomeAstronauta;
        var nomePlaneta;
        var tempoRelativo;
        var diasViagem;
        var horasViagem;
        var minutosViagem;
        var anosTerrestre;
        var imagePath;
        
        
        function ValidarViagem() {
            nomeAstronauta = nome_astronauta.value
            nomePlaneta = nome_planeta.value
            tempoRelativo = Number(tempo_relativo.value)
            diasViagem = Number(dias_viagem.value)
            horasViagem = Number(horas_viagem.value)
            minutosViagem = Number(minutos_viagem.value)
            
            if (nomeAstronauta == "" || nomePlaneta == "" || tempo_relativo <= 0 || (diasViagem <= 0 && horasViagem <= 0 && minutosViagem <= 0)) {
                alert("Preencha os campos corretamente e informe um tempo de viagem válido!")
                viagemValida = false;
            } else {
                viagemValida = true;
            }
        }
        
        function CalcularDuracao() {
            var tempoTotalEmMinutos = diasViagem * 1440 + horasViagem * 60 + minutosViagem;
            anosTerrestre = Math.floor((tempoTotalEmMinutos * tempoRelativo) / 525600);
            
            if (anosTerrestre <= 13) {
                imagePath = "adolescente.png";
            } else if (anosTerrestre <= 30) {
                imagePath = "jovem.png";
            } else if (anosTerrestre <= 65) {
                imagePath = "adulto.png";
            } else if (anosTerrestre <= 100) {
                imagePath = "veio.png";
            } else {
                imagePath = "morto.png";
            }
            
            diasViagem = Math.floor(tempoTotalEmMinutos / 1440);
            tempoTotalEmMinutos = tempoTotalEmMinutos % 1440;
            
            horasViagem = Math.floor(tempoTotalEmMinutos / 60);
            tempoTotalEmMinutos = tempoTotalEmMinutos % 60;
            
            minutosViagem = Math.floor(tempoTotalEmMinutos);
        }
        
        function RegistrarViagem() {
            ValidarViagem()
            if (viagemValida) {
                CalcularDuracao()
                viagens.push([nomeAstronauta, nomePlaneta, tempoRelativo, diasViagem, horasViagem, minutosViagem, anosTerrestre, imagePath])
            }
            
        }
        
        function RelatorioViagens() {
            var totalViagens = viagens.length;
            var relatorio = `<h1>Foram registradas ${totalViagens} viagens, detalhadas a seguir:</h1>`;
            
            for (var i = 0; i < totalViagens; i++) {
                relatorio += `
                    <div
                        style="
                        width: 60%;
                        display: flex;
                        flex-direction: column;
                        padding-left: 10px;
                        padding-bottom: 20px;
                        box-shadow: 0 0 5px 0 black;
                        "
                    >
                        <p style="font-size: 1.25rem">
                            Astronauta ${viagens[i][0]} viajou para o planeta ${viagens[i][1]} e ficou fora por pelo
                            menos ${viagens[i][6]} anos no tempo da Terra. <br />
                            A criança que nasceu quando ele saiu provavelmente está assim hoje:
                        </p>
                        <img
                            src="${viagens[i][7]}"
                            style="width: 200px; height: 200px;"
                        />
                    </div>
                `
            }
            
            relatorio_viagens.innerHTML = relatorio;
        }
    </script>
</body>
</html>
